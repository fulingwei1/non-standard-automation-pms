name: guard-stub-defaults

on:
  pull_request:
    paths:
      - '.env.example'
      - 'app/api/v1/api.py'
      - 'scripts/ci_guard_stub_defaults.py'
      - '.github/workflows/guard-stub-defaults.yml'
  push:
    branches: [ main, master ]
    paths:
      - '.env.example'
      - 'app/api/v1/api.py'
      - 'scripts/ci_guard_stub_defaults.py'

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate stub defaults
        run: python scripts/ci_guard_stub_defaults.py

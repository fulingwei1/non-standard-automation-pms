[pytest]
minversion = 6.0
asyncio_mode = auto
norecursedirs = _obsolete .git __pycache__ node_modules venv
addopts =
    -ra
    -q
    -l
    --strict-markers
    -W ignore::DeprecationWarning
filterwarnings =
    ignore::pydantic.warnings.PydanticDeprecatedSince20
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks tests as unit tests (deselect with '-m "not unit"')
    api: marks tests as api tests (deselect with '-m "not api"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    engineer: tests for engineer endpoints
    pm: tests for PM approval endpoints
    aggregation: tests for progress aggregation logic
    security: security-related tests
    database: tests requiring database access
    asyncio: marks async tests
    e2e: marks end-to-end tests
    auth: marks authentication-related tests
    permission: marks permission-related tests
    performance: marks performance tests (deselect with '-m "not performance"')
